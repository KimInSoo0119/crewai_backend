services:
  # FastAPI
  crewai-api:
    build:
      context: .
      dockerfile: dockerfile.api
    container_name: crewai-api
    ports:
      - "8000:8000"
    env_file:
      - .env

  # CLI 
  crewai-cli:
    build:
      context: .
      dockerfile: dockerfile.cli
    container_name: crewai-cli
    env_file:
      - .env
    stdin_open: true
    tty: true